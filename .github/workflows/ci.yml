name: CI - Governance, Security & Application Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  governance-and-security:
    name: Repository Governance & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full git history required for comprehensive secret scanning

      - name: Verify Documentation & License Files
        run: |
          test -s LICENSE || (echo "ERROR: LICENSE file is missing or empty" && exit 1)
          test -s NOTICE || (echo "ERROR: NOTICE file is missing or empty" && exit 1)
          test -s README.md || (echo "ERROR: README.md file is missing or empty" && exit 1)
          test -s README.it.md || (echo "ERROR: README.it.md file is missing or empty" && exit 1)
          echo "Check passed: All core governance files are present and populated."

      - name: Verify No Forbidden Binary or Sensitive Files Tracked by Git
        run: |
          # Inspect ONLY Git-tracked files via git ls-files.
          FORBIDDEN=$(git ls-files \
            '*.gguf' '*.bin' '*.safetensors' '*.onnx' \
            '*.db' '*.db-wal' '*.db-shm' '*.sqlite' '*.sqlite3' \
            '*.pfx' '*.p12' '*.key' '*.pem' '*.cert' \
            '*.jpg' '*.jpeg' '*.bmp' '*.tif' '*.tiff' '*.webp' '*.raw' '*.dng' \
            ':!docs/assets/*' ':!assets/*' ':!src-tauri/icons/*')
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: The following forbidden binary, scan, or secret files are tracked in Git:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Check passed: No forbidden binary or secret files are tracked by Git."

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  documentation-lint-and-links:
    name: Markdown Linting & Link Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Markdown Linting (markdownlint-cli2)
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

      - name: Markdown Link Checker (Lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude "https://company.wizards.com/.*"
            --exclude "https://img.shields.io/.*"
            README.md README.it.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-checks:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Frontend Build
        run: npm run build

  rust-checks-and-tests:
    name: Rust Quality, Tests & Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust Code Formatting (rustfmt)
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust Linter (clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Automated Database & Backend Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Compile Desktop Binary (Cargo Build)
        run: cargo build --manifest-path src-tauri/Cargo.toml

[package]
name = "mtg-collection-manager"
version = "0.1.0"
description = "MTG Collection Manager - Desktop Application"
authors = ["Manuelsnake"]
license = "Apache-2.0"
repository = "https://github.com/Manuelsnake/MTG-SCANNER-COLLECTION"
edition = "2021"

[lib]
name = "mtg_collection_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.14"
